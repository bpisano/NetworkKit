name: Generate DocC Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install latest Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Generate DocC documentation
        run: |
          swift package \
          --allow-writing-to-directory ./docs \
          generate-documentation \
          --target NetworkKit \
          --output-path ./docs \
          --transform-for-static-hosting \
          --hosting-base-path NetworkKit

      - name: Redirect root to docs/NetworkKit
        run: echo '<script>window.location.href += "/documentation/networkkit"</script>' > .docs/index.html

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
